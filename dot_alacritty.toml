[general]
live_config_reload = true
ipc_socket = true

[env]
TERM = "alacritty"

[window]
decorations = "None"
dynamic_title = true
opacity = 0.8

[font]
size = 10.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Block", blinking = "Never" }

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 3

[colors.primary]
background = "#F5F6FA"
foreground = "#20202A"

[colors.cursor]
text = "#F5F6FA"
cursor = "#20202A"

[colors.selection]
text = "#20202A"
background = "#7A4DA3"

[colors.normal]
black = "#F5F6FA"
red = "#C72C52"
green = "#1F8A55"
yellow = "#A38A00"
blue = "#315FBD"
magenta = "#7A4DA3"
cyan = "#238C8C"
white = "#20202A"

[colors.bright]
black = "#9B97AD"
red = "#A82443"
green = "#187343"
yellow = "#7A6500"
blue = "#244D9A"
magenta = "#65418A"
cyan = "#1B7070"
white = "#20202A"
