include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
radius = 0
fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
border-size = 0

padding-left = 0
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = JetBrainsMono Nerd Font:size=10;2

modules-left = i3
modules-right = xkeyboard systray date

enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
format = <label-state> <label-mode>

label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.blue}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

label-mode = %mode%
label-mode-background = ${colors.accent-alt}
label-mode-foreground = ${colors.foreground}
label-mode-padding = 1

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>
format-padding = 0
label-layout = %layout%
label-layout-foreground = ${colors.muted}
label-indicator-foreground = ${colors.accent-alt}

[module/date]
type = internal/date
interval = 1
date = %b %d
time = %H:%M
label = %{F#8985A1}%date%%{F-} %time%
label-foreground = ${colors.foreground}
format-padding = 0

[module/systray]
type = internal/tray
format-margin = 0
tray-spacing = 2
