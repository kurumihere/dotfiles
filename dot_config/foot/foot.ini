[main]
font=IosevkaTerm NF:size=15

[colors-dark]
alpha=0.85
alpha-mode=all
blur=yes
background=15131a
foreground=f2eef5

## Normal/regular colors (ANSI 0-7)
regular0=24202b  # black
regular1=e57373  # red
regular2=81c784  # green
regular3=ffd54f  # yellow
regular4=9f86d6  # blue/purple (accent)
regular5=ba68c8  # magenta
regular6=4dd0e1  # cyan
regular7=f2eef5  # white

## Bright colors (ANSI 8-15)
bright0=4d445d   # bright black / grey
bright1=ef9a9a   # bright red
bright2=a5d6a7   # bright green
bright3=ffe082   # bright yellow
bright4=b39ddb   # bright lavender
bright5=ce93d8   # bright magenta
bright6=80deea   # bright cyan
bright7=ffffff   # bright white

## Selection & Cursor
selection-foreground=f2eef5
selection-background=3d3649
cursor=15131a ffffff

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes
